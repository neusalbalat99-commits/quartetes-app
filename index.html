<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quartetes</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1 class="title">QUARTETES POPULARS</h1>

    <!-- 🔥 VISTES -->
    <div id="home" class="view active">
         <button class="random-btn" onclick="mostrarAleatoria()">
                    🎲 Nova quarteta
        </button>

        <div id="resultado" class="card"></div>
    </div>


<div id="llistat" class="view">

    <input
        type="text"
        id="busqueda"
        placeholder="Buscar..."
        onkeyup="actualitzarLlista()"
    />

    <select id="filtroTema" onchange="actualitzarLlista()">
        <option value="">Tots els temes</option>
    </select>

    <!-- BOTÓ AFEGIR QUARTETA -->
    <button onclick="mostrarFormulari()">
        ➕ Afegir quarteta
    </button>

    <!-- FORMULARI NOVA QUARTETA -->
    <div id="formulariQuarteta" style="display:none;">

        <h2>Nova quarteta</h2>

        <textarea
            id="novaQuarteta"
            placeholder="Escriu ací la quarteta..."
            rows="6"
        ></textarea>

        <input
            type="text"
            id="nouTema"
            placeholder="Tema"
        />

        <input
            type="text"
            id="nouSubtema"
            placeholder="Subtema"
        />

        <button onclick="guardarQuarteta()">
            💾 Guardar
        </button>

        <button onclick="tancarFormulari()">
            Cancel·lar
        </button>

    </div>

    <div id="lista" class="grid"></div>

</div>

    <div id="favorits" class="view">
        <h2 class="empty">Encara no tens favorits</h2>
    </div>

    <!-- 🔻 MENU INFERIOR -->
    <div class="bottom-nav">
        <button onclick="canviarVista('home')">🎲</button>
        <button onclick="canviarVista('llistat')">📚</button>
        <button onclick="canviarVista('favorits')">⭐</button>
    </div>

    <script src="app.js"></script>

</body>
</html>
