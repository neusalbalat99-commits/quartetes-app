<!DOCTYPE html>
<html lang="ca">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Quartetes</title>

    <link
        rel="stylesheet"
        href="style.css?v=18"
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>


<body>


    <h1 class="title">
        QUARTETES POPULARS
    </h1>


    <!-- =====================================================
         INICI
    ====================================================== -->

    <div id="home" class="view active">

        <button
            class="random-btn"
            onclick="mostrarAleatoria()"
        >
            <svg class="icona-linia" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.5 9a7 7 0 0 1 12-2l2.5 5M18.5 15a7 7 0 0 1-12 2L4 12"/></svg> Nova quarteta
        </button>

        <div
            id="resultado"
            class="card"
        ></div>

    </div>


    <!-- =====================================================
         LLISTAT
    ====================================================== -->

    <div id="llistat" class="view">


        <!-- ZONA DE LLISTAT -->

        <div id="zonaLlistat">

            <div class="barra-eines">

                <div class="fila-cerca">

                    <div class="cerca">

                        <input
                            type="text"
                            id="busqueda"
                            placeholder=""
                            aria-label="Buscar quartetes"
                            onkeyup="actualitzarLlista()"
                        >

                        <span class="icona-cerca">
                            ⌕
                        </span>

                    </div>


                    <div class="selector-tema selector-tema-compacte">

                        <select
                            id="filtroTema"
                            onchange="actualitzarLlista()"
                            aria-label="Filtrar per tema"
                        >
                            <option value="">
                                Tema
                            </option>
                        </select>

                    </div>

                </div>

            </div>


            <div
                id="lista"
                class="grid"
            ></div>

        </div>


        <!-- FORMULARI NOVA QUARTETA -->

        <div
            id="formulariQuarteta"
            class="formulari-quarteta"
            style="display:none;"
        >

            <div class="cap-formulari">

                <h2>
                    Nova quarteta
                </h2>

                <button
                    class="tancar-formulari"
                    onclick="tancarFormulari()"
                    aria-label="Tancar formulari"
                >
                    ×
                </button>

            </div>


            <textarea
                id="novaQuarteta"
                placeholder="Escriu ací la quarteta..."
                rows="6"
            ></textarea>


            <select
                id="nouTema"
                onchange="canviarTemaNou()"
            >
                <option value="">
                    Tria un tema
                </option>
            </select>


            <input
                type="text"
                id="altreTema"
                placeholder="Escriu el nou tema"
                style="display:none;"
            >


            <input
                type="text"
                id="nouSubtema"
                placeholder="Subtema"
            >


            <div class="botons-formulari">

                <button
                    class="boto-guardar"
                    onclick="guardarQuarteta()"
                >
                    Guardar
                </button>

                <button
                    class="boto-cancelar"
                    onclick="tancarFormulari()"
                >
                    Cancel·lar
                </button>

            </div>

        </div>


        <!-- BOTÓ FLOTANT -->

        <button
            id="botoAfegirQuarteta"
            class="boto-afegir-flotant"
            onclick="mostrarFormulari()"
            title="Afegir quarteta"
            aria-label="Afegir quarteta"
        >
            ＋
        </button>


    </div>


    <!-- NOVES SECCIONS -->
    <section id="multimedia" class="view">
        <header class="cap-seccio"><h2>Multimèdia</h2><p>Música, vídeos i gravacions tradicionals.</p></header>
        <div id="filtresMultimedia" class="filtres-contingut"></div>
        <div id="llistaMultimedia" class="graella-contingut"><p>Carregant continguts…</p></div>
    </section>

    <section id="materials" class="view">
        <header class="cap-seccio"><h2>Aprén</h2><p>Materials per descobrir la música tradicional.</p></header>
        <div id="bibliotecaMaterials">
            <div id="filtresMaterials" class="filtres-contingut"></div>
            <div id="llistaMaterials" class="graella-contingut"><p>Carregant materials…</p></div>
        </div>
        <div id="lectorMaterials" class="lector-materials" hidden>
            <div class="lector-cap">
                <button type="button" class="lector-tornar" onclick="tancarLector()">← Materials</button>
                <strong id="lectorTitol"></strong>
            </div>
            <div id="lectorEstat" class="lector-estat" aria-live="polite"></div>
            <div class="lector-pagina" id="lectorPagina">
                <canvas id="lectorCanvas" aria-label="Pàgina del document"></canvas>
            </div>
            <div class="lector-controls">
                <button type="button" id="lectorAnterior" onclick="passarPagina(-1)">‹ Anterior</button>
                <span id="lectorComptador">– / –</span>
                <button type="button" id="lectorSeguent" onclick="passarPagina(1)">Següent ›</button>
            </div>
            <a id="lectorEnllac" class="enllac-material" target="_blank" rel="noopener noreferrer">Obrir PDF original ↗</a>
        </div>
    </section>

    <section id="calendari" class="view">
        <header class="cap-seccio"><h2>Calendari</h2><p>Activitats, trobades i música en directe.</p></header>
        <div class="calendari-targeta">
            <div class="mes-navegacio">
                <button type="button" onclick="moureMes(-1)" aria-label="Mes anterior">‹</button>
                <h3 id="mesActual"></h3>
                <button type="button" onclick="moureMes(1)" aria-label="Mes següent">›</button>
            </div>
            <div class="dies-setmana"><span>Dl</span><span>Dt</span><span>Dc</span><span>Dj</span><span>Dv</span><span>Ds</span><span>Dg</span></div>
            <div id="graellaCalendari" class="graella-calendari"></div>
        </div>
        <h3 id="titolDia" class="titol-dia"></h3>
        <div id="eventsDia" class="events-dia" aria-live="polite"></div>
    </section>

    <!-- =====================================================
         MENÚ INFERIOR
    ====================================================== -->

    <nav class="bottom-nav" aria-label="Navegació principal">
        <button type="button" onclick="canviarVista('home')" aria-label="Quarteta"><span><svg class="icona-linia" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h3c5 0 5 10 10 10h3"/><path d="m17 14 3 3-3 3"/><path d="M4 17h3c2 0 3-1.5 4-3"/><path d="M14 7c1-1 2-2 3-2h3"/><path d="m17 2 3 3-3 3"/></svg></span><small>Quarteta</small></button>
        <button type="button" onclick="canviarVista('llistat')" aria-label="Llistat"><span><svg class="icona-linia" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h12M9 12h12M9 18h12"/><path d="M4 6h.01M4 12h.01M4 18h.01"/></svg></span><small>Llistat</small></button>
        <button type="button" onclick="canviarVista('multimedia')" aria-label="Multimèdia"><span><svg class="icona-linia" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m10 8 6 4-6 4z"/></svg></span><small>Multimèdia</small></button>
        <button type="button" onclick="canviarVista('materials')" aria-label="Aprén"><span><svg class="icona-linia" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6c-3-2-6-2-10-1v14c4-1 7-1 10 1 3-2 6-2 10-1V5c-4-1-7-1-10 1z"/><path d="M12 6v14"/></svg></span><small>Aprén</small></button>
        <button type="button" onclick="canviarVista('calendari')" aria-label="Calendari"><span><svg class="icona-linia" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18M8 14h2M14 14h2"/></svg></span><small>Agenda</small></button>
    </nav>


    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="app.js?v=18"></script>


</body>

</html>
