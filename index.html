<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quartetes</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1 class="title">QUARTETES POPULARS</h1>

    <!-- 🔥 VISTES -->
    <div id="home" class="view active">
         <button class="random-btn" onclick="mostrarAleatoria()">
                    🎲 Nova quarteta
        </button>

        <div id="resultado" class="card"></div>
    </div>


<div id="llistat" class="view">

    <!-- ZONA DE LLISTAT -->
    <div id="zonaLlistat">

        <div class="barra-eines">

            <div class="cerca">
                <input
                    type="text"
                    id="busqueda"
                    placeholder="Buscar quartetes..."
                    onkeyup="actualitzarLlista()"
                />

                <span class="icona-cerca">⌕</span>
            </div>

            <div class="selector-tema">
                <select
                    id="filtroTema"
                    onchange="actualitzarLlista()"
                >
                    <option value="">Tots els temes</option>
                </select>
            </div>

        </div>

        <div id="lista" class="grid"></div>

    </div>


    <!-- FORMULARI NOVA QUARTETA -->
    <div
        id="formulariQuarteta"
        class="formulari-quarteta"
        style="display:none;"
    >

        <div class="cap-formulari">

            <h2>Nova quarteta</h2>

            <button
                class="tancar-formulari"
                onclick="tancarFormulari()"
            >
                ×
            </button>

        </div>


        <textarea
            id="novaQuarteta"
            placeholder="Escriu ací la quarteta..."
            rows="6"
        ></textarea>


        <select
            id="nouTema"
            onchange="canviarTemaNou()"
        >
            <option value="">Tria un tema</option>
        </select>


        <input
            type="text"
            id="altreTema"
            placeholder="Escriu el nou tema"
            style="display:none;"
        />


        <input
            type="text"
            id="nouSubtema"
            placeholder="Subtema"
        />


        <div class="botons-formulari">

            <button
                class="boto-guardar"
                onclick="guardarQuarteta()"
            >
                Guardar
            </button>

            <button
                class="boto-cancelar"
                onclick="tancarFormulari()"
            >
                Cancel·lar
            </button>

        </div>

    </div>


    <!-- BOTÓ FLOTANT -->
    <button
        id="botoAfegirQuarteta"
        class="boto-afegir-flotant"
        onclick="mostrarFormulari()"
        title="Afegir quarteta"
    >
        ＋
    </button>

</div>

<div id="calendari" class="view">

    <div class="cap-calendari">
        <h2>Calendari</h2>
        <p>Activitats, trobades i dates destacades.</p>
    </div>

    <div class="contenidor-calendari">

        <!-- ACÍ POSAREM EL GOOGLE CALENDAR -->

        <iframe
            class="google-calendar"
            src="URL_DEL_TEU_GOOGLE_CALENDAR"
            frameborder="0"
            scrolling="no"
        ></iframe>

    </div>

</div>

    <!-- 🔻 MENU INFERIOR -->
    <div class="bottom-nav">
        <button onclick="canviarVista('home')">🎲</button>
        <button onclick="canviarVista('llistat')">📚</button>
        <button onclick="canviarVista('calendari')">📅</button>
    </div>

    <script src="app.js?v=2"></script>

</body>
</html>
